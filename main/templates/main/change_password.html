{% extends "admin/base_site.html" %}

{% block content %}

<div style="
    max-width: 650px;
    margin: 30px auto;
    background: white;
    padding: 30px;
    border-radius: 15px;
">

```
<h1>
    🔐 تغيير كلمة مرور الطالب
</h1>

<p style="
    margin: 20px 0;
    font-size: 18px;
">
    الطالب:
    <strong>
        {{ student.student_name }}
    </strong>
</p>

{% if form.non_field_errors %}

    <div style="
        background: #fff0f0;
        color: #b3261e;
        padding: 12px;
        border-radius: 10px;
        margin-bottom: 20px;
    ">

        {{ form.non_field_errors }}

    </div>

{% endif %}


<form method="post">

    {% csrf_token %}

    {{ form.as_p }}

    <div style="margin-top: 25px;">

        <button
            type="submit"
            class="default"
        >
            حفظ كلمة المرور الجديدة ✅
        </button>

        <a
            href="{% url 'admin:main_student_change' student.pk %}"
            style="margin-right: 15px;"
        >
            إلغاء
        </a>

    </div>

</form>
```

</div>

{% endblock %}
